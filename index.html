<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <form action="/iniciar-sesión" method="post">
    <h1>Iniciar Sesión</h1>
        <div class="login">
        <h2>Ingrese Su Usuario</h2>
            <input type="email" placeholder="ejemplo@gmail.com"><br><br>
        <h2>Ingrese Su Usurio</h2>
            <input type="password" placeholder="contraseña"><br><br>
        <button type="submit">Iniciar sesión</button>
        </div>
    </form>
</div>
</body>
</html>
