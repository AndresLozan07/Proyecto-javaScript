<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios - Acme School</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <acme-header></acme-header>

    <main>

        <h2>Gestión de usuarios</h2>

        <p id="mensaje" class="mensaje" role="status"></p>

        <section>
            <h3 id="tituloFormulario">Registrar usuario</h3>

            <form id="formUsuario">

                <input type="hidden" id="usuarioId">

                <label for="identificacion">Número de identificación</label>
                <input type="number" id="identificacion" name="identificacion" required>

                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" required>

                <label for="cargo">Cargo</label>
                <select id="cargo" name="cargo" required>
                    <option value="">Seleccione un cargo</option>
                    <option value="Administrativo">Administrativo</option>
                    <option value="Docente">Docente</option>
                </select>

                <label for="contrasena">Contraseña (mínimo 6 caracteres)</label>
                <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" required>

                <button type="submit" id="botonGuardar">Guardar usuario</button>
                <button type="button" id="botonCancelar" class="boton-secundario" hidden>Cancelar edición</button>

            </form>
        </section>

        <section>
            <h3>Usuarios registrados</h3>

            <tabla-usuarios id="tablaUsuarios"></tabla-usuarios>
        </section>

    </main>

    <script type="module" src="../js/usuarios.js"></script>
</body>
</html>
