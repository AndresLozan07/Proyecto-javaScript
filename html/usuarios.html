<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios - Acme School</title>
</head>
<body>

    <header>
        <h1>Acme School</h1>

        <nav>
            <a href="usuarios.html">Usuarios</a>
            <a href="examenes.html">Exámenes</a>
            <a href="resolver-examenes.html">Resolver exámenes</a>
            <a href="index.html">Cerrar sesión</a>
        </nav>
    </header>

    <main>

        <h2>Gestión de usuarios</h2>

        <section>
            <h3>Registrar usuario</h3>

            <form>

                <label for="identificacion">Número de identificación</label><br>
                <input type="number" id="identificacion" name="identificacion" required><br><br>

                <label for="nombre">Nombre completo</label><br>
                <input type="text" id="nombre" name="nombre" required><br><br>

                <label for="correo">Correo electrónico</label><br>
                <input type="email" id="correo" name="correo" required><br><br>

                <label for="telefono">Teléfono</label><br>
                <input type="tel" id="telefono" name="telefono" required><br><br>

                <label for="cargo">Cargo</label><br>
                <select id="cargo" name="cargo" required>
                    <option value="">Seleccione un cargo</option>
                    <option value="Administrativo">Administrativo</option>
                    <option value="Docente">Docente</option>
                </select><br><br>

                <label for="contrasena">Contraseña</label><br>
                <input type="password" id="contrasena" name="contrasena" required><br><br>

                <button type="submit">Guardar usuario</button>
                <button type="reset">Limpiar formulario</button>

            </form>
        </section>

        <section>
            <h3>Usuarios registrados</h3>

            <table border="1">

                <thead>
                    <tr>
                        <th>Identificación</th>
                        <th>Nombre completo</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Cargo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>123456</td>
                        <td>Usuario de ejemplo</td>
                        <td>usuario@gmail.com</td>
                        <td>3001234567</td>
                        <td>Docente</td>
                        <td>
                            <button type="button">Actualizar</button>
                            <button type="button">Eliminar</button>
                        </td>
                    </tr>
                </tbody>

            </table>
        </section>

    </main>

</body>
</html>
