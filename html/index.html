<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Acme School</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pagina-login">

    <main class="login">

        <h1>Acme School</h1>
        <h2>Iniciar sesión</h2>

        <form id="formLogin" novalidate>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" autocomplete="username" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" autocomplete="current-password" required>

            <p id="mensaje" class="mensaje" role="alert"></p>

            <button type="submit">Iniciar sesión</button>

        </form>

        <p class="ayuda-login">
            ¿Vas a presentar un examen?
            <a href="resolver-examenes.html">Ver exámenes disponibles</a>
        </p>

    </main>

    <script type="module" src="../js/index.js"></script>
</body>
</html>
