<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de exámenes - Acme School</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <acme-header></acme-header>

    <main>

        <h2>Gestión de exámenes</h2>

        <p id="mensaje" class="mensaje" role="status"></p>

        <section>
            <h3 id="tituloFormularioExamen">Crear examen</h3>

            <form id="formExamen">

                <input type="hidden" id="examenId">

                <label for="codigo">Código</label>
                <input type="text" id="codigo" name="codigo" required>

                <label for="titulo">Título del examen</label>
                <input type="text" id="titulo" name="titulo" required>

                <label for="tiempo">Tiempo (minutos)</label>
                <input type="number" id="tiempo" name="tiempo" min="1" required>

                <label for="porcentaje">Porcentaje de aprobación</label>
                <input type="number" id="porcentaje" name="porcentaje" min="0" max="100" required>

                <label for="descripcion">Descripción del examen</label>
                <textarea id="descripcion" name="descripcion" required></textarea>

                <button type="submit" id="botonGuardarExamen">Guardar examen</button>
                <button type="button" id="botonCancelarExamen" class="boton-secundario" hidden>Cancelar edición</button>

            </form>
        </section>

        <section>
            <h3>Exámenes registrados</h3>

            <tabla-examenes id="tablaExamenes"></tabla-examenes>
        </section>

        <!-- Esta sección aparece al crear o editar un examen -->
        <section id="seccionPreguntas" hidden>
            <h3>Preguntas del examen: <span id="nombreExamenActual"></span></h3>

            <div id="listaPreguntas"></div>

            <form id="formPregunta">

                <input type="hidden" id="preguntaId">

                <label for="pregunta">Descripción de la pregunta</label>
                <textarea id="pregunta" name="pregunta" required></textarea>

                <h4>Respuestas (mínimo 2, marca la correcta)</h4>

                <div class="fila-respuesta">
                    <div class="campo">
                        <label for="respuesta1">Respuesta 1</label>
                        <input type="text" id="respuesta1" name="respuesta1">
                    </div>
                    <label class="correcta-opcion">
                        <input type="radio" name="correcta" value="1"> Correcta
                    </label>
                </div>

                <div class="fila-respuesta">
                    <div class="campo">
                        <label for="respuesta2">Respuesta 2</label>
                        <input type="text" id="respuesta2" name="respuesta2">
                    </div>
                    <label class="correcta-opcion">
                        <input type="radio" name="correcta" value="2"> Correcta
                    </label>
                </div>

                <div class="fila-respuesta">
                    <div class="campo">
                        <label for="respuesta3">Respuesta 3</label>
                        <input type="text" id="respuesta3" name="respuesta3">
                    </div>
                    <label class="correcta-opcion">
                        <input type="radio" name="correcta" value="3"> Correcta
                    </label>
                </div>

                <div class="fila-respuesta">
                    <div class="campo">
                        <label for="respuesta4">Respuesta 4</label>
                        <input type="text" id="respuesta4" name="respuesta4">
                    </div>
                    <label class="correcta-opcion">
                        <input type="radio" name="correcta" value="4"> Correcta
                    </label>
                </div>

                <button type="submit" id="botonGuardarPregunta">Guardar pregunta</button>
                <button type="button" id="botonCancelarPregunta" class="boton-secundario" hidden>Cancelar edición</button>

            </form>
        </section>

    </main>

    <script type="module" src="../js/examenes.js"></script>
</body>
</html>
