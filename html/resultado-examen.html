<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del examen - Acme School</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header class="encabezado">
        <h1>Acme School</h1>
    </header>

    <main>

        <h2>Resultado del examen</h2>

        <section>
            <h3>Información del estudiante</h3>

            <p>Nombre: <strong id="nombreEstudiante"></strong></p>
            <p>Identificación: <strong id="idEstudiante"></strong></p>
            <p>Examen: <strong id="tituloExamen"></strong></p>
        </section>

        <section>
            <h3>Resultados obtenidos</h3>

            <p>Respuestas correctas: <strong id="correctas"></strong></p>
            <p>Porcentaje obtenido: <strong id="porcentaje"></strong></p>
            <p>Porcentaje necesario para aprobar: <strong id="necesario"></strong></p>

            <p id="mensajeResultado" class="resultado" role="status"></p>
        </section>

        <a class="boton" href="resolver-examenes.html">Volver a los exámenes</a>

    </main>

    <script type="module" src="../js/resultado-examen.js"></script>
</body>
</html>
