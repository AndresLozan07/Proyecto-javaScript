<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolver examen - Acme School</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header class="encabezado-examen">
        <div>
            <h1 id="tituloExamen">Cargando examen...</h1>
            <p>Estudiante: <span id="nombreEstudiante"></span></p>
            <p>Total de preguntas: <span id="totalPreguntas"></span></p>
            <p>Porcentaje para aprobar: <span id="porcentajeAprobacion"></span></p>
        </div>

        <div class="caja-reloj">
            <span>Tiempo restante</span>
            <strong id="reloj" role="timer">--:--</strong>
        </div>
    </header>

    <main>

        <form id="formExamen">

            <div id="preguntas"></div>

            <button type="submit">Terminar examen</button>

        </form>

    </main>

    <script type="module" src="../js/realizar-examen.js"></script>
</body>
</html>
