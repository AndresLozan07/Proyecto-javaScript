
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del estudiante - Acme School</title>
</head>
<body>

    <header>
        <h1>Acme School</h1>
    </header>

    <main>

        <h2>Identificación del estudiante</h2>

        <p>Ingrese sus datos para comenzar el examen.</p>

        <form action="realizar-examen.html" method="get">

            <label for="identificacion">Número de identificación</label><br>
            <input type="number" id="identificacion" name="identificacion" required><br><br>

            <label for="nombre">Nombre completo</label><br>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <button type="submit">Comenzar examen</button>

        </form>

    </main>

</body>
</html>
